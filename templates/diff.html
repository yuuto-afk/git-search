<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; }
    #controls { margin-bottom: 16px; }
    #repoUrl { width: 360px; padding: 4px 8px; }
    #loadBtn { padding: 4px 10px; }

    #loading {
      display: none;
      margin-top: 20px;
      font-size: 18px;
      color: #444;
    }
    .spinner {
      border: 4px solid #eee;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #commitSelect { margin-top: 20px; display: none; }
    select { padding: 4px 8px; width: 300px; }
  </style>
</head>
<body>

<h2>Git リポジトリの差分</h2>

<div id="controls">
  <label for="repoUrl">GitHub URL:</label>
  <input id="repoUrl" type="text" placeholder="https://github.com/user/repo">
  <button id="loadBtn">差分を表示</button>
</div>

<!-- ロード中 UI -->
<div id="loading">
  <span class="spinner"></span>
  リポジトリを clone しています…
</div>

<!-- コミット選択 UI -->
<div id="commitSelect">
  <h3>コミットを選択してください</h3>

  <label>コミット A:</label><br>
  <select id="commitA"></select><br><br>

  <label>コミット B:</label><br>
  <select id="commitB"></select><br><br>

  <button id="diffBtn">差分を表示</button>
</div>

<div id="diff"></div>

<script>
  const renderDiff = (text) => {
    const diffHtml = Diff2Html.html(text, {
      drawFileList: true,
      matching: "lines",
      outputFormat: "line-by-line"
    });
    document.getElementById("diff").innerHTML = diffHtml;
  };

  // clone → コミット一覧取得
  document.getElementById("loadBtn").addEventListener("click", async () => {
    const url = document.getElementById("repoUrl").value;

    document.getElementById("loading").style.display = "block";
    document.getElementById("diff").innerHTML = "";
    document.getElementById("commitSelect").style.display = "none";

    const res = await fetch("/clone", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });

    const data = await res.json();
    document.getElementById("loading").style.display = "none";

    // コミット一覧を select に追加
    const commitA = document.getElementById("commitA");
    const commitB = document.getElementById("commitB");
    commitA.innerHTML = "";
    commitB.innerHTML = "";

    data.commits.forEach(c => {
      const optA = document.createElement("option");
      optA.value = c.hash;
      optA.textContent = `${c.hash} - ${c.message}`;
      commitA.appendChild(optA);

      const optB = document.createElement("option");
      optB.value = c.hash;
      optB.textContent = `${c.hash} - ${c.message}`;
      commitB.appendChild(optB);
    });

    document.getElementById("commitSelect").style.display = "block";
  });

  // 差分表示
  document.getElementById("diffBtn").addEventListener("click", async () => {
    const a = document.getElementById("commitA").value;
    const b = document.getElementById("commitB").value;

    const res = await fetch("/diff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a, b })
    });

    const data = await res.json();
    renderDiff(data.diff);
  });
</script>

</body>
</html>
