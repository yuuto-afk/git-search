<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; }
    #controls { margin-bottom: 16px; }
    #repoUrl { width: 360px; padding: 4px 8px; }
    #loadBtn { padding: 4px 10px; }

    /* ロード中 UI */
    #loading {
      display: none;
      margin-top: 20px;
      font-size: 18px;
      color: #444;
    }

    .spinner {
      border: 4px solid #eee;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<h2>Git リポジトリの差分</h2>

<div id="controls">
  <label for="repoUrl">GitHub URL:</label>
  <input id="repoUrl" type="text" placeholder="https://github.com/user/repo">
  <button id="loadBtn">差分を表示</button>
</div>

<!-- ロード中 UI -->
<div id="loading">
  <span class="spinner"></span>
  リポジトリを clone しています…
</div>

<div id="diff"></div>

<script>
  const renderDiff = (text) => {
    const diffHtml = Diff2Html.html(text, {
      drawFileList: true,
      matching: "lines",
      outputFormat: "line-by-line"
    });
    document.getElementById("diff").innerHTML = diffHtml;
  };

  document.getElementById("loadBtn").addEventListener("click", async () => {
    const url = document.getElementById("repoUrl").value;

    // ロード中 UI を表示
    document.getElementById("loading").style.display = "block";
    document.getElementById("diff").innerHTML = "";

    const res = await fetch("/diff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    // ロード中 UI を非表示
    document.getElementById("loading").style.display = "none";

    renderDiff(data.diff);
  });
</script>

</body>
</html>
