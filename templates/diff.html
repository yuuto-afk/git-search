<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub Viewer</title>

  <!-- diff2html -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>

  <!-- 外部CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<h2>GitHub Viewer</h2>

<!-- GitHub URL 入力欄（Google風） -->
<div id="urlBox">
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input id="repoUrl" type="text" placeholder="GitHub URL を入力してください…">
    <button id="loadBtn">clone</button>
  </div>
</div>

<!-- ロード中 UI -->
<div id="loading">
  <span class="spinner"></span>
  リポジトリを clone しています…
</div>

<!-- モード選択（clone 後に表示） -->
<div id="modeSelect">
  <h3>モード選択</h3>
  <select id="mode">
    <option value="">選択してください</option>
    <option value="diff">コミットの差分を見るモード</option>
    <option value="search">ソースコード検索モード</option>
  </select>
</div>

<!-- 差分モード -->
<div id="diffMode">
  <h3>コミットの差分を見るモード</h3>

  <!-- ▼ 新しく追加：ブランチ選択欄 -->
  <div id="branchSelect" style="display:none; margin-top:20px;">
    <h3>ブランチを選択してください</h3>
    <select id="branchList"></select>
  </div>

  <!-- ▼ コミット選択欄（ブランチ選択後に表示） -->
  <div id="commitSelect" style="display:none; margin-top:20px;">
    <h3>コミットを選択してください</h3>

    <label>変更前コミット:</label><br>
    <select id="commitA"></select><br>

    <label>変更後コミット:</label><br>
    <select id="commitB"></select><br>

    <button id="diffBtn">差分を表示</button>
  </div>

  <div id="diff"></div>
</div>

<!-- 外部JS -->
<script src="/static/js/main.js"></script>

</body>
</html>
